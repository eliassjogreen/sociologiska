services:
  migrate:
    # image: ghcr.io/eliassjogreen/sociologiska-migrate:main
    build:
       target: migrate
       dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE: /app/data/sociologiska.db
    volumes:
      - ./data:/app/data
    restart: "no"

  server:
    # image: ghcr.io/eliassjogreen/sociologiska-server:main
    build:
       target: server
       dockerfile: Dockerfile
    depends_on:
      - migrate
    env_file: .env
    environment:
      DATABASE: /app/data/sociologiska.db
    ports:
      - "4321:4321"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  export:
    # image: ghcr.io/eliassjogreen/sociologiska-export:main
    build:
       target: export
       dockerfile: Dockerfile
    depends_on:
      - migrate
    env_file: .env
    environment:
      DATABASE: /app/data/sociologiska.db
      INTERVAL: 60
    volumes:
      - ./data:/app/data
    restart: unless-stopped
